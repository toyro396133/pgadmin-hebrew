name: Bootstrap repository

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bootstrap archive
        id: bootstrap
        shell: bash
        run: |
          if [[ -f .bootstrap/pgadmin-hebrew-bootstrap.tar.xz ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap archive is no longer present; nothing to import."
          fi

      - name: Extract project files
        if: steps.bootstrap.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap/work
          mkdir -p .bootstrap/work
          tar -xJf .bootstrap/pgadmin-hebrew-bootstrap.tar.xz -C .bootstrap/work
          shopt -s dotglob nullglob
          cp -a .bootstrap/work/pgadmin-hebrew-bootstrap/. .
          rm -rf .bootstrap

      - name: Commit imported project
        if: steps.bootstrap.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: import complete pgAdmin Hebrew package"
          git push origin HEAD:main
